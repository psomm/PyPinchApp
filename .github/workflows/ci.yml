name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - name: Export locked dependencies
        run: uv export --frozen --no-emit-project --output-file build/audit-requirements.txt
      - name: Audit locked dependencies
        run: uvx --from pip-audit==2.10.1 pip-audit --disable-pip --require-hashes --strict -r build/audit-requirements.txt
